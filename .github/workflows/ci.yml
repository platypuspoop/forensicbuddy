name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret
          BOOTSTRAP_ADMIN_PASSWORD: CI-only-password-123!
          EVIDENCE_FERNET_KEY: ""
        run: pytest -q
